<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="fonts/fonts.css" rel="stylesheet">
</helmet>
<footer style="background:#EDE9DF;font-family:Inter,sans-serif;color:#17142E;border-top:1px solid rgba(23,20,46,0.10);">
  <div style="max-width:1440px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(20px,4.5vw,64px) 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:48px;">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px;">
      <div style="display:flex;flex-direction:column;gap:20px;max-width:360px;">
        <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;color:#17142E;text-decoration:none;">
          <img src="LOGOS/head_logo.png" alt="" style="width:48px;height:24px;object-fit:contain;">
          <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.03em;">Sidekick</span>
        </a>
        <svg width="220" height="40" viewBox="0 0 220 40" aria-hidden="true">
          <rect x="2" y="5" width="18" height="30" rx="4" fill="none" stroke="#17142E" stroke-width="2"></rect>
          <line x1="20" y1="20" x2="170" y2="20" stroke="#17142E" stroke-width="2" stroke-linecap="round"></line>
          <circle cx="95" cy="20" r="7" fill="#C6FF33" stroke="#17142E" stroke-width="2"></circle>
          <rect x="172" y="8" width="38" height="24" rx="3" fill="none" stroke="#17142E" stroke-width="2"></rect>
          <line x1="166" y1="34" x2="216" y2="34" stroke="#17142E" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <p style="margin:0;font-size:16px;line-height:1.55;color:#55526B;">Your Android phone, on your Mac — over your own Wi-Fi. For Macs with Apple silicon on macOS 11.0 (Big Sur) or later, and Android 10 or later.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,96px);">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="3">
          <nav aria-label="{{ c.title }}" style="display:flex;flex-direction:column;gap:4px;min-width:140px;">
            <span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#55526B;padding-bottom:8px;">{{ c.title }}</span>
            <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
              <a href="{{ l.href }}" style="color:#17142E;text-decoration:none;font-size:16px;font-weight:500;min-height:36px;display:flex;align-items:center;" style-hover="color:#3A22B8;text-decoration:underline;text-underline-offset:5px;">{{ l.label }}</a>
            </sc-for>
          </nav>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:24px;border-top:1px solid rgba(23,20,46,0.12);font-size:14px;color:#55526B;line-height:1.55;">
      <span>© 2026 Chetan Pujari</span>
      <span style="max-width:640px;">The phone-to-Mac connection stays on your own network. This site runs no analytics. See <a href="Support.dc.html#privacy" style="color:#5B3DF5;text-underline-offset:4px;">Privacy</a>.</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420}}">
class Component extends DCLogic {
  renderVals() {
    const L = (label, href) => ({ label, href });
    // SITE_MODE=manual: Get Sidekick is the request-access email, and Privacy is this site's own page.
    const manual = !!(window.SK_CONFIG && window.SK_CONFIG.siteMode === 'manual');
    return {
      cols: [
        { title: 'Product', links: [L('Features','Home.dc.html#features'), L('How it works','Home.dc.html#how'), L("What's next",'Roadmap.dc.html'), L(manual ? 'Request access' : 'Get Sidekick','Get Sidekick.dc.html')] },
        { title: 'Support', links: [L('Setup','Support.dc.html#setup'), L('Help','Support.dc.html#help'), L('Permissions','Support.dc.html#permissions'), L('Changelog','Support.dc.html#changelog')] },
        { title: 'About', links: [manual ? L('Privacy','Support.dc.html#privacy') : (/*AUTOMATED{*/ L('Privacy','Support.dc.html#privacy') ?? /*}AUTOMATED*/ null), L('Suggest a feature','Roadmap.dc.html#suggest'), L('Contact','Support.dc.html#help')] }
      ]
    };
  }
}
</script>
</body>
</html>
