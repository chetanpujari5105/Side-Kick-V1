<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Page not found — Sidekick</title>
<meta name="robots" content="noindex">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0;background:#F6F3EC;color:#17142E;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:#5B3DF5;}
a:hover{color:#3A22B8;}
:focus-visible{outline:2px solid #5B3DF5;outline-offset:2px;}
</style>
</helmet>
<dc-import name="SiteHeader" active="" hint-size="100%,88px"></dc-import>
<main id="main" style="max-width:1440px;margin:0 auto;padding:clamp(40px,7vw,120px) clamp(20px,4.5vw,64px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:56px;min-height:60vh;">
  <div style="display:flex;flex-direction:column;gap:24px;max-width:640px;">
    <span style="font:500 15px 'JetBrains Mono',monospace;color:#55526B;">{{ code }}</span>
    <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(46px,6.4vw,92px);line-height:0.96;font-weight:800;letter-spacing:-0.045em;">{{ pre }}<span style="position:relative;display:inline-block;"><span style="position:absolute;left:-0.04em;right:-0.06em;bottom:0.06em;height:0.3em;background:#C6FF33;border-radius:0.08em;transform:rotate(-1.5deg);"></span><span style="position:relative;">{{ mark }}</span></span>{{ post }}</h1>
    <p style="margin:0;font-size:19px;line-height:1.55;color:#55526B;">{{ body }}</p>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;">
      <a href="{{ primaryHref }}" onClick="{{ primaryClick }}" style="min-height:56px;padding:0 30px;border-radius:999px;background:#C6FF33;border:1.5px solid #17142E;color:#17142E;font-size:17px;font-weight:600;display:flex;align-items:center;text-decoration:none;transition:transform .15s, box-shadow .15s;box-sizing:border-box;" style-hover="transform:translateY(-2px);box-shadow:0 3px 0 #17142E;color:#17142E;">{{ primary }}</a>
      <a href="Support.dc.html#help" style="min-height:44px;display:flex;align-items:center;font-size:17px;font-weight:600;color:#5B3DF5;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px;">Get help</a>
    </div>
  </div>
  <svg width="420" height="140" viewBox="0 0 420 140" aria-hidden="true" style="max-width:100%;">
    <rect x="6" y="20" width="58" height="104" rx="13" fill="#FFFFFF" stroke="#17142E" stroke-width="2.5"></rect>
    <path d="M 64 72 C 110 72, 120 40, 160 40" fill="none" stroke="#17142E" stroke-width="2.5" stroke-linecap="round"></path>
    <path d="M 260 104 C 300 104, 310 72, 340 72" fill="none" stroke="#17142E" stroke-width="2.5" stroke-linecap="round"></path>
    <circle cx="160" cy="40" r="5" fill="#17142E"></circle>
    <circle cx="260" cy="104" r="5" fill="#17142E"></circle>
    <circle cx="210" cy="72" r="12" fill="#C6FF33" stroke="#17142E" stroke-width="2.5"></circle>
    <rect x="342" y="34" width="72" height="50" rx="6" fill="#E8E2FF" stroke="#17142E" stroke-width="2.5"></rect>
    <line x1="334" y1="92" x2="418" y2="92" stroke="#17142E" stroke-width="2.5" stroke-linecap="round"></line>
  </svg>
</main>
<dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;notfound&quot;,&quot;error&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { kind: 'notfound' };
  componentDidMount() { if ((location.hash || '') === '#error') this.setState({ kind: 'error' }); }
  renderVals() {
    const k = this.props.kind && this.props.kind !== 'auto' ? this.props.kind : this.state.kind;
    return k === 'error' ? {
      code: 'Error 500', pre: 'Something ', mark: 'broke', post: ' on our side.',
      body: "The page couldn't load. Nothing you did caused it, and nothing was changed. Try again in a moment.",
      primary: 'Try again', primaryHref: '#', primaryClick: (e) => { e.preventDefault(); location.reload(); }
    } : {
      code: 'Error 404', pre: 'This link goes ', mark: 'nowhere', post: '.',
      body: "The page you were looking for isn't here. It may have moved, or the address may have a typo.",
      primary: 'Back to the homepage', primaryHref: 'Home.dc.html', primaryClick: undefined
    };
  }
}
</script>
</body>
</html>
